<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    Velocidade do carro: <input type="number" name="txtvel" id="txtvel"> Km/h
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res">

    </div>
    <script>
        function calcular() {
            var txtv = window.document.getElementById('txtvel')
            var res = document.getElementById('res')
            var vel = Number(txtv.value)
            res.innerHTML = `A sua velocidade atual é de ${vel}`
            if (vel > 80) {
                res.innerHTML += `<p>Você ultrapassou a velocidade permitida. MULTADO!`
            }
            res.innerHTML += `<p> Dirija sempre usando cinto de segurança! `
        
        }
        if (vel > 80) {
            console.log (`Você ultrapassou a velocidade permitida. MULTADO!`)
        } else {
            console.log (`Você está com a velocidade dentro do permitido.`)
            console.log (`Dirija sempre usando cinto de segurança!`)
        }
    </script>
</body>
</html>
